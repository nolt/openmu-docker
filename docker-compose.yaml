services:
  db:
    image: postgres:18.3-trixie
    container_name: openmu-postgres
    restart: always
    networks:
      - openmu-network
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
      - PGDATA=/var/lib/postgresql/data/pgdata
      - TZ=${TIMEZ}
    volumes:
      - openmu-db-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  openmu:
    build:
      context: .
      dockerfile: Dockerfile
    image: openmu:latest
    container_name: openmu-server
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    networks:
      - openmu-network
    environment:
      - DB_HOST=db
      - DB_ADMIN_USER=${DB_USER}
      - DB_ADMIN_PW=${DB_PASS}
      - ASPNETCORE_URLS=http://+:8080
      - TZ=${TIMEZ}
    ports:
      - "44405:44405" # ConnectServer_GMO_client
      - "44406:44406" # ConnectServer_OpenSource_client
      - "55901:55901" # GameServer_GMO_client
      - "55902:55902" # GameServer_OpenSource_client
      - "${ADM_PORT:-8080}:8080" # Admin_Panel

  db-backup:
    image: postgres:18.3-trixie
    container_name: openmu-db-backup
    restart: unless-stopped
    networks:
      - openmu-network
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_NAME=${DB_NAME}
      - BACKUP_DIR=/backups
      - BACKUP_INTERVAL=${BACKUP_INTERVAL:-86400}
      - RETENTION_DAYS=${RETENTION_DAYS:-7}
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASS}
      - TZ=${TIMEZ}
    volumes:
      - ./backups:/backups
      - ./backup/backup.sh:/usr/local/bin/backup.sh
    depends_on:
      db:
        condition: service_healthy
    # Unhealthy if no fresh backup within the interval (+90 min grace) - a quick
    # visual signal in `docker ps` that backups have stopped.
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name 'openmu_*.dump.gz' -mmin -$$(( ${BACKUP_INTERVAL:-86400} / 60 + 90 )) | grep -q ."]
      interval: 10m
      timeout: 10s
      retries: 2
      start_period: 2m
    command: >
      sh -c "
      while true; do
        /usr/local/bin/backup.sh;
        sleep ${BACKUP_INTERVAL:-86400};
      done
      "

networks:
  openmu-network:
    name: openmu-network
    driver: bridge

volumes:
  openmu-db-data:
    name: openmu-db
